# A push to main does not build by itself: this workflow first points the README download
# command at the version the push is about to become (vN, N = commit count, the README commit
# included), commits that as "README", then starts release.yml. The commit is pushed with the
# workflow token, which by design starts no workflow, hence the explicit dispatch.
name: bump

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Point the README at the next version
        run: |
          tag="v$(( $(git rev-list --count HEAD) + 1 ))"
          sed -i -E \
            -e "s|^# Fetch the latest version.*|# Fetch the latest version ($tag)|" \
            -e "s|releases/download/[^ ]+$|releases/download/$tag/airplay-os.img.xz|" README.md
          git diff --quiet README.md && { echo "README already at $tag"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "README" README.md
          git push origin HEAD:main

      - name: Build and release it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main
