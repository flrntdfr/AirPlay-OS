version: 2
updates:
  - package-ecosystem: bundler
    directory: /ui
    schedule:
      interval: weekly
    groups:
      ruby-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # flake.lock (nixpkgs and friends)
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
